<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formula Recognition Demo & Test Suite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .test-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .test-title {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 15px;
      color: #444;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .latex-input {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      margin-bottom: 15px;
      border-left: 3px solid #667eea;
      word-break: break-all;
    }

    .test-result {
      margin-top: 15px;
      padding: 15px;
      background: #f0f4ff;
      border-radius: 4px;
    }

    .result-label {
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    .result-value {
      margin-left: 10px;
      color: #333;
    }

    .family-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
      color: white;
      margin: 3px;
    }

    .theorem-list {
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .theorem-item {
      background: white;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      border-left: 3px solid #667eea;
      font-size: 0.9em;
    }

    .similarity-bar {
      height: 20px;
      background: linear-gradient(to right, #667eea, #764ba2);
      border-radius: 3px;
      margin-top: 5px;
      position: relative;
    }

    .similarity-value {
      position: absolute;
      right: 5px;
      top: 2px;
      color: white;
      font-size: 0.8em;
      font-weight: 600;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95em;
      font-weight: 500;
      background: #667eea;
      color: white;
      margin: 5px;
    }

    .btn:hover {
      background: #5568d3;
    }

    .stats-summary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 30px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat-item {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 6px;
    }

    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9em;
      opacity: 0.9;
    }

    .controls {
      text-align: center;
      margin-bottom: 30px;
    }

    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85em;
    }

    .section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section h2 {
      margin-bottom: 20px;
      color: #333;
      border-bottom: 3px solid #667eea;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Formula Recognition Test Suite & Demo</h1>

    <div class="stats-summary">
      <h2 style="margin-bottom: 20px;">System Performance Overview</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="totalTests">0</div>
          <div class="stat-label">Test Cases</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="avgCategoryConf">0%</div>
          <div class="stat-label">Avg Categorization Confidence</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="avgRelated">0</div>
          <div class="stat-label">Avg Related Theorems</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="processingTime">0ms</div>
          <div class="stat-label">Total Processing Time</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="runAllTests()">▶ Run All Tests</button>
      <button class="btn" onclick="exportResults()">💾 Export Results</button>
      <button class="btn" onclick="location.reload()">🔄 Reset</button>
    </div>

    <div class="section">
      <h2>Test Cases: Categorization & Theorem Matching</h2>
      <div class="test-grid" id="testGrid"></div>
    </div>

    <div class="section">
      <h2>📊 Detailed Performance Metrics</h2>
      <div id="metricsDisplay"></div>
    </div>

    <div class="section">
      <h2>💻 Code Examples</h2>
      <h3>Basic Usage:</h3>
      <pre id="codeExample"></pre>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script type="module">
    import { CategorizeFormula, FindRelated, FAMILIES } from '../shared/kb.js'

    const TEST_CASES = [
      {
        title: 'Zariski Topology',
        latex: String.raw`V(I)=\{\,x \mid f(x)=0,\ \forall f\in I\,\}`,
        expectedFamily: 'foundation',
        description: 'Classical Zariski closed set definition'
      },
      {
        title: 'Sheaf Cohomology',
        latex: String.raw`H^n(X, \mathcal{F}) = \mathrm{Ext}^n(\mathbb{Z}, \mathcal{F})`,
        expectedFamily: 'cohomology',
        description: 'Sheaf cohomology as Ext functor'
      },
      {
        title: 'Spec Construction',
        latex: String.raw`\mathrm{Spec}(A) = \{\mathfrak{p} \mid \mathfrak{p} \text{ is prime in } A\}`,
        expectedFamily: 'scheme',
        description: 'Spectrum of a ring'
      },
      {
        title: 'Intersection Number',
        latex: String.raw`C_1 \cdot C_2 = \deg(\mathcal{O}(C_1)|_{C_2})`,
        expectedFamily: 'intersect',
        description: 'Intersection of curves on a surface'
      },
      {
        title: 'Genus Formula',
        latex: String.raw`g = \frac{(d-1)(d-2)}{2}`,
        expectedFamily: 'curve',
        description: 'Genus of plane curve of degree d'
      },
      {
        title: 'Canonical Bundle',
        latex: String.raw`K_X = \omega_X \cong \Omega^n_X`,
        expectedFamily: 'birational',
        description: 'Canonical sheaf and differential forms'
      },
      {
        title: 'Chern Class',
        latex: String.raw`c_1(\mathcal{L}) = [\mathrm{div}(s)] \in \mathrm{CH}^1(X)`,
        expectedFamily: 'intersect',
        description: 'First Chern class of line bundle'
      },
      {
        title: 'Blow-up Formula',
        latex: String.raw`\widetilde{X} \xrightarrow{\pi} X, \quad E = \pi^{-1}(p)`,
        expectedFamily: 'map',
        description: 'Blow-up morphism and exceptional divisor'
      },
      {
        title: 'Moduli Functor',
        latex: String.raw`\mathcal{M}_g(T) = \{\text{families of curves over } T\}`,
        expectedFamily: 'modern',
        description: 'Moduli of genus g curves as functor'
      },
      {
        title: 'Riemann-Roch',
        latex: String.raw`\chi(\mathcal{L}) = \deg(\mathcal{L}) + 1 - g`,
        expectedFamily: 'curve',
        description: 'Classical Riemann-Roch for curves'
      },
      {
        title: 'Nakayama Lemma',
        latex: String.raw`M = \mathfrak{m}M \Rightarrow M = 0`,
        expectedFamily: 'foundation',
        description: 'Fundamental commutative algebra result'
      },
      {
        title: 'Derived Category',
        latex: String.raw`D^b(\mathrm{Coh}(X))`,
        expectedFamily: 'cohomology',
        description: 'Bounded derived category of coherent sheaves'
      }
    ]

    const categoryColors = {
      foundation: '#7fd4ff',
      scheme: '#ffd27f',
      cohomology: '#9dffb0',
      map: '#ff9fd0',
      curve: '#c0a6ff',
      intersect: '#ffb08a',
      birational: '#8affe8',
      modern: '#e0e0ff'
    }

    let results = []
    let totalProcessingTime = 0

    function createTestCard(testCase, index) {
      const card = document.createElement('div')
      card.className = 'test-card'
      card.id = `test-${index}`
      card.innerHTML = `
        <div class="test-title">${index + 1}. ${testCase.title}</div>
        <div class="latex-input">${testCase.latex}</div>
        <div style="font-size: 0.9em; color: #666; margin-bottom: 10px;">
          ${testCase.description}
        </div>
        <div style="font-size: 0.85em; color: #999;">
          Expected: <span class="family-badge" style="background: ${categoryColors[testCase.expectedFamily]}">
            ${testCase.expectedFamily}
          </span>
        </div>
        <div class="test-result" id="result-${index}" style="display: none;"></div>
      `
      return card
    }

    function runTest(testCase, index) {
      const startTime = performance.now()

      // Categorization
      const category = CategorizeFormula(testCase.latex)

      // Find related theorems
      const related = FindRelated(testCase.latex)

      const processingTime = performance.now() - startTime
      totalProcessingTime += processingTime

      const isCorrect = category.family === testCase.expectedFamily

      const result = {
        testCase,
        category,
        related,
        processingTime,
        isCorrect
      }

      results.push(result)

      displayResult(result, index)
      updateStats()

      return result
    }

    function displayResult(result, index) {
      const resultDiv = document.getElementById(`result-${index}`)
      resultDiv.style.display = 'block'

      const { category, related, processingTime, isCorrect } = result

      resultDiv.innerHTML = `
        <div class="result-label">
          ${isCorrect ? '✅' : '⚠️'} Categorization Result:
          <span class="family-badge" style="background: ${categoryColors[category.family]}">
            ${category.family}
          </span>
        </div>
        <div style="font-size: 0.85em; color: #666; margin: 5px 0;">
          Confidence: ${(category.confidence * 100).toFixed(1)}%
        </div>
        <div style="font-size: 0.85em; color: #666; margin-bottom: 10px;">
          ${category.reasoning}
        </div>

        <div class="result-label" style="margin-top: 15px;">
          🔗 Related Theorems (${related.length}):
        </div>
        <div class="theorem-list">
          ${related.slice(0, 5).map(theorem => `
            <div class="theorem-item">
              <div style="font-weight: 600;">${theorem.name}</div>
              <div style="font-size: 0.85em; color: #666;">${theorem.en}</div>
              <div class="similarity-bar" style="width: ${theorem.similarity * 100}%">
                <div class="similarity-value">${(theorem.similarity * 100).toFixed(1)}%</div>
              </div>
              <div style="font-size: 0.8em; color: #888; margin-top: 3px;">
                ${theorem.reason}
              </div>
            </div>
          `).join('')}
        </div>

        <div style="text-align: right; font-size: 0.8em; color: #999; margin-top: 10px;">
          Processed in ${processingTime.toFixed(2)}ms
        </div>
      `
    }

    function updateStats() {
      document.getElementById('totalTests').textContent = results.length

      const avgConf = results.reduce((sum, r) => sum + r.category.confidence, 0) / results.length
      document.getElementById('avgCategoryConf').textContent = (avgConf * 100).toFixed(1) + '%'

      const avgRelated = results.reduce((sum, r) => sum + r.related.length, 0) / results.length
      document.getElementById('avgRelated').textContent = avgRelated.toFixed(1)

      document.getElementById('processingTime').textContent = totalProcessingTime.toFixed(0) + 'ms'

      // Update detailed metrics
      updateMetrics()
    }

    function updateMetrics() {
      const correct = results.filter(r => r.isCorrect).length
      const accuracy = (correct / results.length * 100).toFixed(1)

      const familyStats = {}
      for (const family in categoryColors) {
        const familyTests = results.filter(r => r.testCase.expectedFamily === family)
        if (familyTests.length > 0) {
          const familyCorrect = familyTests.filter(r => r.isCorrect).length
          familyStats[family] = {
            total: familyTests.length,
            correct: familyCorrect,
            accuracy: (familyCorrect / familyTests.length * 100).toFixed(1)
          }
        }
      }

      const metricsHTML = `
        <div style="margin-bottom: 30px;">
          <h3>Overall Accuracy</h3>
          <div style="font-size: 2em; font-weight: bold; color: ${correct === results.length ? '#2e7d32' : '#f57c00'};">
            ${accuracy}% (${correct}/${results.length})
          </div>
        </div>

        <div style="margin-bottom: 30px;">
          <h3>Per-Family Accuracy</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            ${Object.entries(familyStats).map(([family, stats]) => `
              <div style="padding: 15px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid ${categoryColors[family]};">
                <div style="font-weight: 600; margin-bottom: 5px;">${family}</div>
                <div style="font-size: 1.5em; font-weight: bold;">${stats.accuracy}%</div>
                <div style="font-size: 0.85em; color: #666;">${stats.correct}/${stats.total} correct</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <h3>Recommendation Quality</h3>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
            <div style="padding: 15px; background: #f0f4ff; border-radius: 6px;">
              <div style="font-size: 1.5em; font-weight: bold;">
                ${(results.reduce((sum, r) => sum + r.related.length, 0) / results.length).toFixed(1)}
              </div>
              <div style="font-size: 0.85em; color: #666;">Avg Theorems Found</div>
            </div>
            <div style="padding: 15px; background: #f0f4ff; border-radius: 6px;">
              <div style="font-size: 1.5em; font-weight: bold;">
                ${(results.reduce((sum, r) => sum + (r.related[0]?.similarity || 0), 0) / results.length * 100).toFixed(1)}%
              </div>
              <div style="font-size: 0.85em; color: #666;">Avg Top-1 Similarity</div>
            </div>
            <div style="padding: 15px; background: #f0f4ff; border-radius: 6px;">
              <div style="font-size: 1.5em; font-weight: bold;">
                ${(totalProcessingTime / results.length).toFixed(1)}ms
              </div>
              <div style="font-size: 0.85em; color: #666;">Avg Processing Time</div>
            </div>
          </div>
        </div>
      `

      document.getElementById('metricsDisplay').innerHTML = metricsHTML
    }

    async function runAllTests() {
      results = []
      totalProcessingTime = 0

      for (let i = 0; i < TEST_CASES.length; i++) {
        await new Promise(resolve => setTimeout(resolve, 50)) // Small delay for visual effect
        runTest(TEST_CASES[i], i)
      }
    }

    function exportResults() {
      const exportData = {
        timestamp: new Date().toISOString(),
        totalTests: results.length,
        accuracy: (results.filter(r => r.isCorrect).length / results.length * 100).toFixed(1) + '%',
        avgConfidence: (results.reduce((sum, r) => sum + r.category.confidence, 0) / results.length * 100).toFixed(1) + '%',
        avgRelated: (results.reduce((sum, r) => sum + r.related.length, 0) / results.length).toFixed(1),
        totalProcessingTime: totalProcessingTime.toFixed(0) + 'ms',
        results: results.map(r => ({
          title: r.testCase.title,
          latex: r.testCase.latex,
          expected: r.testCase.expectedFamily,
          actual: r.category.family,
          confidence: r.category.confidence,
          relatedCount: r.related.length,
          topSimilarity: r.related[0]?.similarity || 0,
          processingTime: r.processingTime,
          correct: r.isCorrect
        }))
      }

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `formula-recognition-results-${Date.now()}.json`
      a.click()
      URL.revokeObjectURL(url)
    }

    // Initialize
    const testGrid = document.getElementById('testGrid')
    TEST_CASES.forEach((testCase, index) => {
      testGrid.appendChild(createTestCard(testCase, index))
    })

    // Code example
    document.getElementById('codeExample').textContent = `
import { CategorizeFormula, FindRelated } from './formula-recognition.js'

// Categorize a formula
const category = CategorizeFormula(String.raw\`H^n(X, \\mathcal{F})\`)
console.log(category.family)      // → 'cohomology'
console.log(category.confidence)  // → 0.85

// Find related theorems
const related = FindRelated(String.raw\`\\pi_1(X)\`)
related.forEach(theorem => {
  console.log(\`\${theorem.name}: \${(theorem.similarity * 100).toFixed(1)}%\`)
})

// Full recognition pipeline (with image input)
const result = await RecognizeFormula(canvasElement)
if (result.latex) {
  const category = CategorizeFormula(result.latex)
  const theorems = FindRelated(result.latex)

  console.log('Recognized:', result.latex)
  console.log('Category:', category.family)
  console.log('Related:', theorems.length, 'theorems')
}
    `.trim()

    // Make functions global for buttons
    window.runAllTests = runAllTests
    window.exportResults = exportResults
  </script>
</body>
</html>
