<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>render 调试页 · 公式大陆</title>
  <style>
    html, body { margin: 0; background: #e8e4da; font: 13px/1.4 "Microsoft YaHei", sans-serif; color: #2b2a26; }
    #wrap { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #spec { display: none; }
    body.specimen #map { display: none; }
    body.specimen #spec { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
    #spec figure { margin: 0; background: #fbf8f1; border: 1px solid rgba(80,64,40,.22); border-radius: 6px; padding: 6px; }
    #spec figcaption { padding: 4px 2px 0; color: #7a7468; }
    #info { position: absolute; right: 8px; top: 8px; background: rgba(251,248,241,.9); padding: 4px 8px; border-radius: 4px; white-space: pre; font: 12px monospace; }
  </style>
</head>
<body>
  <!-- 用法：
       ?s=2&sel=cn-hodge&hits=a,b&hover=id&labels=1   真实 world 的单帧渲染（labels=1 用真实 labeler）
       ?mode=specimen                                  符号 / 道路 / 岛屿状态样张（对照 SPEC §3.3） -->
  <div id="wrap">
    <canvas id="map"></canvas>
    <div id="spec"></div>
    <div id="info"></div>
  </div>
  <script type="module" src="./dev.js"></script>
</body>
</html>
