<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#ffffff"/>

  <!-- Core nebula -->
  <circle cx="16" cy="14" r="8" fill="url(#favicon-gradient)" opacity="0.4"/>
  <circle cx="16" cy="16" r="6" fill="url(#favicon-gradient)" opacity="0.7"/>

  <!-- Central point -->
  <circle cx="16" cy="16" r="1.5" fill="#fbbf24"/>

  <!-- Formula accent -->
  <g stroke="url(#favicon-gradient)" stroke-width="0.8" fill="none" stroke-linecap="round">
    <path d="M 12 12 L 14 9 L 16 12"/>
    <line x1="16" y1="14" x2="16" y2="18"/>
    <line x1="14" y1="16" x2="18" y2="16"/>
  </g>

  <!-- Stars -->
  <circle cx="8" cy="8" r="0.5" fill="#fbbf24"/>
  <circle cx="24" cy="10" r="0.5" fill="#fbbf24"/>
</svg>