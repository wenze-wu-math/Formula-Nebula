<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#f8fafc"/>

  <!-- Nebula core -->
  <circle cx="32" cy="28" r="16" fill="url(#icon-gradient)" opacity="0.3" filter="url(#icon-glow)"/>
  <circle cx="32" cy="32" r="12" fill="url(#icon-gradient)" opacity="0.5" filter="url(#icon-glow)"/>

  <!-- Formula elements -->
  <g stroke="url(#icon-gradient)" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- Lambda -->
    <path d="M 20 22 L 24 14 L 28 22"/>
    <!-- Plus -->
    <line x1="32" y1="24" x2="32" y2="32"/>
    <line x1="28" y1="28" x2="36" y2="28"/>
    <!-- Sigma -->
    <path d="M 40 14 L 48 14 L 40 22 L 48 30"/>
  </g>

  <!-- Central dot -->
  <circle cx="32" cy="32" r="2.5" fill="url(#icon-gradient)"/>

  <!-- Stars -->
  <g fill="#fbbf24">
    <circle cx="15" cy="15" r="1"/>
    <circle cx="50" cy="18" r="1"/>
    <circle cx="45" cy="48" r="1"/>
  </g>
</svg>