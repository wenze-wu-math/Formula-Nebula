<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nebula-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#nebula-gradient)" stroke-width="2" opacity="0.3"/>

  <!-- Nebula cloud effect -->
  <ellipse cx="100" cy="85" rx="45" ry="50" fill="url(#nebula-gradient)" opacity="0.3" filter="url(#glow)"/>
  <ellipse cx="80" cy="100" rx="35" ry="40" fill="#7c3aed" opacity="0.2" filter="url(#glow)"/>
  <ellipse cx="120" cy="100" rx="35" ry="40" fill="#2563eb" opacity="0.2" filter="url(#glow)"/>

  <!-- Central glow -->
  <circle cx="100" cy="100" r="30" fill="url(#glow-gradient)" filter="url(#glow)"/>

  <!-- Formula equation (mathematical symbols) -->
  <g fill="none" stroke="url(#nebula-gradient)" stroke-width="1.5" stroke-linecap="round">
    <!-- Lambda symbol simplified -->
    <path d="M 95 80 L 100 70 L 105 80"/>
    <line x1="95" y1="80" x2="105" y2="80"/>

    <!-- Plus symbol -->
    <line x1="100" y1="115" x2="100" y2="125"/>
    <line x1="95" y1="120" x2="105" y2="120"/>

    <!-- Integral-like curve -->
    <path d="M 85 110 Q 82 115 85 120" stroke-width="1"/>
    <path d="M 115 110 Q 118 115 115 120" stroke-width="1"/>
  </g>

  <!-- Stars scattered around -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="70" cy="60" r="1.5"/>
    <circle cx="130" cy="70" r="1.5"/>
    <circle cx="65" cy="120" r="1.5"/>
    <circle cx="135" cy="115" r="1.5"/>
    <circle cx="100" cy="50" r="1"/>
    <circle cx="100" cy="150" r="1"/>
  </g>

  <!-- Center accent circle -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="15" fill="none" stroke="url(#nebula-gradient)" stroke-width="1" opacity="0.8"/>
</svg>