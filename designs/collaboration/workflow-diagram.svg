<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #4a4a4a; }
      .box { fill: #f0f4ff; stroke: #4a90e2; stroke-width: 2; rx: 8; }
      .process-box { fill: #e8f4f8; stroke: #2196f3; stroke-width: 2; rx: 8; }
      .decision-box { fill: #fff4e6; stroke: #f39c12; stroke-width: 2; rx: 8; }
      .endpoint-box { fill: #e8f8e8; stroke: #2ecc71; stroke-width: 2; rx: 8; }
      .reject-box { fill: #ffe8e8; stroke: #e74c3c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a2e; }
      .small-text { font-family: Arial, sans-serif; font-size: 12px; fill: #4a4a4a; }
      .arrow { stroke: #4a90e2; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .decision-arrow { stroke: #f39c12; stroke-width: 2; fill: none; marker-end: url(#arrowhead-decision); }
      .reviewer { fill: #e8e8ff; stroke: #7b68ee; stroke-width: 1.5; rx: 6; }
      .checklist { font-family: Arial, sans-serif; font-size: 11px; fill: #2a2a2a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-decision" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f39c12" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Peer Review Workflow</text>
  <text x="600" y="65" class="subtitle" text-anchor="middle">Mathematical Proof Evaluation System</text>

  <!-- 1. Submission -->
  <rect x="450" y="100" width="300" height="80" class="box"/>
  <text x="600" y="130" class="text" text-anchor="middle" font-weight="bold">1. PROOF SUBMISSION</text>
  <text x="600" y="150" class="small-text" text-anchor="middle">SubmitForReview(proofId, data, authorId)</text>
  <text x="600" y="170" class="small-text" text-anchor="middle">Creates v1 snapshot • Status: pending</text>

  <!-- Arrow down -->
  <path d="M 600 180 L 600 210" class="arrow"/>

  <!-- 2. Reviewer Assignment -->
  <rect x="450" y="210" width="300" height="80" class="process-box"/>
  <text x="600" y="240" class="text" text-anchor="middle" font-weight="bold">2. REVIEWER ASSIGNMENT</text>
  <text x="600" y="260" class="small-text" text-anchor="middle">AssignReviewers(reviewId, userIds)</text>
  <text x="600" y="280" class="small-text" text-anchor="middle">Creates checklist • Sets deadline • Status: in_review</text>

  <!-- Arrow down to reviewers -->
  <path d="M 600 290 L 600 320" class="arrow"/>

  <!-- Reviewers -->
  <g id="reviewers">
    <rect x="200" y="320" width="120" height="60" class="reviewer"/>
    <text x="260" y="345" class="text" text-anchor="middle" font-weight="bold">Reviewer 1</text>
    <text x="260" y="365" class="small-text" text-anchor="middle">Assigned</text>

    <rect x="400" y="320" width="120" height="60" class="reviewer"/>
    <text x="460" y="345" class="text" text-anchor="middle" font-weight="bold">Reviewer 2</text>
    <text x="460" y="365" class="small-text" text-anchor="middle">Assigned</text>

    <rect x="600" y="320" width="120" height="60" class="reviewer"/>
    <text x="660" y="345" class="text" text-anchor="middle" font-weight="bold">Reviewer 3</text>
    <text x="660" y="365" class="small-text" text-anchor="middle">Assigned</text>

    <rect x="800" y="320" width="120" height="60" class="reviewer"/>
    <text x="860" y="345" class="text" text-anchor="middle" font-weight="bold">Reviewer N</text>
    <text x="860" y="365" class="small-text" text-anchor="middle">Assigned</text>
  </g>

  <!-- Arrows from reviewers converging -->
  <path d="M 260 380 L 260 450 L 600 450" class="arrow"/>
  <path d="M 460 380 L 460 450 L 600 450" class="arrow"/>
  <path d="M 660 380 L 660 450 L 600 450" class="arrow"/>
  <path d="M 860 380 L 860 450 L 600 450" class="arrow"/>

  <!-- 3. Review Process -->
  <rect x="350" y="470" width="500" height="240" class="process-box"/>
  <text x="600" y="495" class="text" text-anchor="middle" font-weight="bold">3. REVIEW PROCESS</text>

  <!-- Checklist -->
  <text x="370" y="520" class="checklist" font-weight="bold">✓ CHECKLIST (8 criteria):</text>
  <text x="385" y="540" class="checklist">• Mathematical correctness</text>
  <text x="385" y="555" class="checklist">• Proof completeness</text>
  <text x="385" y="570" class="checklist">• Clarity and readability</text>
  <text x="385" y="585" class="checklist">• Mathematical rigor</text>
  <text x="385" y="600" class="checklist">• Novelty and originality</text>
  <text x="385" y="615" class="checklist">• Proper citations</text>
  <text x="385" y="630" class="checklist">• Notation consistency</text>
  <text x="385" y="645" class="checklist">• Logical structure</text>

  <!-- Feedback -->
  <text x="620" y="520" class="checklist" font-weight="bold">✓ FEEDBACK:</text>
  <text x="635" y="540" class="checklist">• Strengths</text>
  <text x="635" y="555" class="checklist">• Weaknesses</text>
  <text x="635" y="570" class="checklist">• Suggestions</text>
  <text x="635" y="585" class="checklist">• General comments</text>
  <text x="635" y="600" class="checklist">• Confidential notes</text>

  <text x="635" y="630" class="checklist" font-weight="bold">✓ VERDICT:</text>
  <text x="650" y="650" class="checklist">• Accept</text>
  <text x="650" y="665" class="checklist">• Revise (with feedback)</text>
  <text x="650" y="680" class="checklist">• Reject</text>

  <!-- Arrow down -->
  <path d="M 600 710 L 600 740" class="arrow"/>

  <!-- 4. Feedback Submission -->
  <rect x="450" y="740" width="300" height="80" class="process-box"/>
  <text x="600" y="770" class="text" text-anchor="middle" font-weight="bold">4. FEEDBACK SUBMISSION</text>
  <text x="600" y="790" class="small-text" text-anchor="middle">SubmitReview(reviewId, reviewerId, feedback, verdict)</text>
  <text x="600" y="810" class="small-text" text-anchor="middle">Stores feedback • Updates status: completed</text>

  <!-- Arrow down to decision -->
  <path d="M 600 820 L 600 850" class="arrow"/>

  <!-- Decision Diamond -->
  <polygon points="600,850 750,900 600,950 450,900" class="decision-box"/>
  <text x="600" y="895" class="text" text-anchor="middle" font-weight="bold">All reviews</text>
  <text x="600" y="915" class="text" text-anchor="middle" font-weight="bold">complete?</text>

  <!-- NO arrow loops back -->
  <path d="M 450 900 L 350 900 L 350 460 L 600 460" class="decision-arrow"/>
  <text x="360" y="890" class="small-text">NO</text>
  <text x="280" y="905" class="small-text">Wait for remaining reviews</text>

  <!-- YES arrow -->
  <path d="M 600 950 L 600 980" class="decision-arrow"/>
  <text x="615" y="970" class="small-text">YES</text>

  <!-- 5. Aggregate Verdict -->
  <rect x="450" y="980" width="300" height="70" class="process-box"/>
  <text x="600" y="1010" class="text" text-anchor="middle" font-weight="bold">5. AGGREGATE VERDICT</text>
  <text x="600" y="1030" class="small-text" text-anchor="middle">Majority rule applied • Status: completed • Notifies author</text>

  <!-- Arrow down -->
  <path d="M 600 1050 L 600 1080" class="arrow"/>

  <!-- Verdict Options -->
  <text x="600" y="1100" class="text" text-anchor="middle" font-weight="bold">VERDICT</text>

  <!-- Accept -->
  <rect x="150" y="1120" width="150" height="60" class="endpoint-box"/>
  <text x="225" y="1145" class="text" text-anchor="middle" font-weight="bold">ACCEPT</text>
  <text x="225" y="1165" class="small-text" text-anchor="middle">Ready for publication</text>
  <path d="M 600 1105 L 225 1120" class="arrow"/>

  <!-- Revise -->
  <rect x="525" y="1120" width="150" height="60" class="decision-box"/>
  <text x="600" y="1145" class="text" text-anchor="middle" font-weight="bold">REVISE</text>
  <text x="600" y="1165" class="small-text" text-anchor="middle">Revision required</text>
  <path d="M 600 1105 L 600 1120" class="arrow"/>

  <!-- Reject -->
  <rect x="900" y="1120" width="150" height="60" class="reject-box"/>
  <text x="975" y="1145" class="text" text-anchor="middle" font-weight="bold">REJECT</text>
  <text x="975" y="1165" class="small-text" text-anchor="middle">Not suitable</text>
  <path d="M 600 1105 L 975 1120" class="arrow"/>

  <!-- Accept path -->
  <rect x="150" y="1200" width="150" height="50" class="endpoint-box"/>
  <text x="225" y="1230" class="text" text-anchor="middle" font-weight="bold">Published</text>
  <path d="M 225 1180 L 225 1200" class="arrow"/>

  <!-- Reject path -->
  <rect x="900" y="1200" width="150" height="50" class="reject-box"/>
  <text x="975" y="1230" class="text" text-anchor="middle" font-weight="bold">End</text>
  <path d="M 975 1180 L 975 1200" class="arrow"/>

  <!-- Revise path loops back -->
  <path d="M 600 1180 L 600 1250 L 950 1250 L 950 100 L 600 100" class="decision-arrow"/>
  <text x="960" y="1245" class="small-text">Author revises</text>

  <!-- 6. Versioning Box -->
  <rect x="100" y="1350" width="1000" height="220" class="box"/>
  <text x="600" y="1375" class="text" text-anchor="middle" font-weight="bold">6. VERSIONING &amp; REVISION CYCLE</text>

  <text x="120" y="1405" class="small-text" font-weight="bold">If verdict = REVISE:</text>

  <text x="140" y="1430" class="small-text">• Author makes changes → Creates new version (v2)</text>
  <text x="140" y="1450" class="small-text">• TrackVersions(proofId) - Stores complete version history</text>
  <text x="140" y="1470" class="small-text">• Each version: metadata + content hash for integrity</text>

  <text x="120" y="1500" class="small-text" font-weight="bold">Version Comparison:</text>
  <text x="140" y="1520" class="small-text">• GenerateDiff(proofId, v1, v2)</text>
  <text x="140" y="1540" class="small-text">• Detects: +additions  -deletions  ~modifications</text>
  <text x="140" y="1560" class="small-text">• Visual diff display with statistics</text>

  <!-- Key Metrics -->
  <rect x="50" y="1300" width="250" height="30" class="endpoint-box"/>
  <text x="175" y="1320" class="small-text" text-anchor="middle" font-weight="bold">8-Point Checklist | 3 Verdicts | Full Versioning</text>

  <rect x="900" y="1300" width="250" height="30" class="endpoint-box"/>
  <text x="1025" y="1320" class="small-text" text-anchor="middle" font-weight="bold">Collaborative • Transparent • Trackable</text>
</svg>
