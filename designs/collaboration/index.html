<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Group Hub | Formula Nebula</title>
  <link rel="stylesheet" href="../shared/style-base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1>📚 Study Group Hub</h1>
      <div class="header-actions">
        <button id="create-group-btn" class="btn-primary">+ Create Group</button>
        <div id="voice-indicator" class="voice-inactive">🔇 Voice inactive</div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar: Groups List -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>My Groups</h2>
        </div>
        <div id="groups-list" class="groups-list">
          <!-- Groups will be rendered here -->
        </div>

        <!-- System Stats -->
        <div class="system-stats">
          <h3>System Stats</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="stat-groups">0</span>
              <span class="stat-label">Groups</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-members">0</span>
              <span class="stat-label">Members</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-problems">0</span>
              <span class="stat-label">Problems</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-active">0</span>
              <span class="stat-label">Active</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Group Header -->
        <div class="group-header">
          <div class="group-info">
            <h2 id="current-group-name">Select a group</h2>
            <p id="current-group-topic" class="group-topic-text"></p>
          </div>
          <div class="group-actions">
            <button id="start-voice-btn" class="btn-secondary">🎤 Start Voice</button>
            <button id="leave-voice-btn" class="btn-secondary">🔇 Leave Voice</button>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="tab-nav">
          <button class="nav-tab active" data-tab="chat">💬 Chat</button>
          <button class="nav-tab" data-tab="whiteboard">🎨 Whiteboard</button>
          <button class="nav-tab" data-tab="problems">📝 Problems</button>
          <button class="nav-tab" data-tab="progress">📊 Progress</button>
        </nav>

        <!-- Tab Content -->
        <div class="tabs-container">
          <!-- Chat Tab -->
          <div id="chat-tab" class="tab-content active">
            <div class="chat-container">
              <div id="chat-messages" class="chat-messages">
                <!-- Messages will be rendered here -->
              </div>
              <div class="chat-input-container">
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Type a message..."
                  class="chat-input"
                />
                <button id="send-message-btn" class="btn-primary">Send</button>
              </div>
            </div>
          </div>

          <!-- Whiteboard Tab -->
          <div id="whiteboard-tab" class="tab-content">
            <div class="whiteboard-container">
              <div class="whiteboard-toolbar">
                <button id="clear-whiteboard-btn" class="btn-secondary">Clear</button>
                <button id="export-whiteboard-btn" class="btn-secondary">Export</button>
                <span id="whiteboard-stats" class="whiteboard-stats"></span>
              </div>
              <canvas
                id="whiteboard-canvas"
                width="1200"
                height="600"
                class="whiteboard-canvas"
              ></canvas>
              <div class="whiteboard-help">
                Click and drag to draw. Use toolbar for more options.
              </div>
            </div>
          </div>

          <!-- Problems Tab -->
          <div id="problems-tab" class="tab-content">
            <div class="problems-container">
              <div class="problems-header">
                <h3>Problem Sets</h3>
                <button id="create-problemset-btn" class="btn-primary">
                  + Create Problem Set
                </button>
              </div>
              <div id="problems-list" class="problems-list">
                <!-- Problem sets will be rendered here -->
              </div>
            </div>
          </div>

          <!-- Progress Tab -->
          <div id="progress-tab" class="tab-content">
            <div id="progress-content" class="progress-container">
              <!-- Progress will be rendered here -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="demo.js"></script>
</body>
</html>
