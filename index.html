<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Formula Nebula - 代数几何知识图谱的三维星云可视化。探索 464 个数学公式与猜想之间的联系。">
  <meta name="keywords" content="数学可视化,代数几何,知识图谱,3D可视化,公式星云,数学教育">
  <meta name="author" content="Formula Nebula Team">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://formula-nebula.vercel.app/">
  <meta property="og:title" content="Formula Nebula - 代数几何知识星云">
  <meta property="og:description" content="405条定理 + 59条猜想，在3D星云中探索数学的结构与美">
  <meta property="og:image" content="/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://formula-nebula.vercel.app/">
  <meta property="twitter:title" content="Formula Nebula - 代数几何知识星云">
  <meta property="twitter:description" content="405条定理 + 59条猜想，在3D星云中探索数学的结构与美">
  <meta property="twitter:image" content="/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">

  <!-- Title -->
  <title>Formula Nebula - 公式诗云 · 代数几何知识星云</title>

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- KaTeX CSS (for fast formula rendering) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"
    integrity="sha384-beuqjL2bw+6DBM2eOpr5+Ugx/B2UQM2uYvKxXjJwjREWRVfxFXezj6NIcEKdCT5M"
    crossorigin="anonymous">

  <!-- Inline Critical CSS for Splash Screen -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0a0e27;
      color: #ffffff;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.5s ease-out;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    .splash-tagline {
      font-size: 1.1rem;
      color: #a0aec0;
      margin-bottom: 3rem;
      text-align: center;
      max-width: 90%;
    }

    .splash-progress {
      width: 300px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease-out;
      animation: shimmer 2s ease-in-out infinite;
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .splash-status {
      font-size: 0.9rem;
      color: #718096;
      min-height: 1.5em;
    }

    .splash-stats {
      margin-top: 2rem;
      display: flex;
      gap: 3rem;
      color: #a0aec0;
      font-size: 0.85rem;
    }

    .splash-stat {
      text-align: center;
    }

    .splash-stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin-bottom: 0.25rem;
    }

    /* Mobile Adjustments */
    @media (max-width: 768px) {
      .splash-logo {
        font-size: 2rem;
      }

      .splash-tagline {
        font-size: 0.95rem;
      }

      .splash-progress {
        width: 80%;
      }

      .splash-stats {
        gap: 2rem;
        font-size: 0.8rem;
      }

      .splash-stat-value {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-logo">🌌 Formula Nebula</div>
    <div class="splash-tagline">代数几何知识图谱的三维星云可视化</div>

    <div class="splash-progress">
      <div class="splash-progress-bar" id="progress-bar"></div>
    </div>
    <div class="splash-status" id="splash-status">正在初始化...</div>

    <div class="splash-stats">
      <div class="splash-stat">
        <span class="splash-stat-value">405</span>
        <span class="splash-stat-label">定理</span>
      </div>
      <div class="splash-stat">
        <span class="splash-stat-value">59</span>
        <span class="splash-stat-label">猜想</span>
      </div>
      <div class="splash-stat">
        <span class="splash-stat-value">1620</span>
        <span class="splash-stat-label">关联</span>
      </div>
    </div>
  </div>

  <!-- Main App Canvas -->
  <canvas id="scene"></canvas>

  <!-- Main App Script -->
  <script type="module">
    // Splash screen controller
    const splash = document.getElementById('splash');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('splash-status');

    let progress = 0;

    function updateSplash(percent, status) {
      progress = Math.max(progress, percent);
      progressBar.style.width = progress + '%';
      statusText.textContent = status;
    }

    // Simulate initial loading
    updateSplash(10, '加载资源...');

    // Expose to main.js
    window.__splashControl = {
      update: updateSplash,
      hide: () => {
        updateSplash(100, '准备就绪 ✨');
        setTimeout(() => {
          splash.classList.add('fade-out');
          setTimeout(() => {
            splash.style.display = 'none';
          }, 500);
        }, 300);
      }
    };

    // Load main application
    import('./src/main.js').catch(err => {
      console.error('Failed to load main app:', err);
      statusText.textContent = '加载失败，请刷新页面';
      statusText.style.color = '#fc8181';
    });
  </script>

  <!-- Service Worker Registration (Production only) -->
  <script>
    if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.log('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
