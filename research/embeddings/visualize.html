<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph Embedding Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .controls {
      background: #f8f9fa;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.85em;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="file"], input[type="number"], button {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover, button:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
    }

    .visualization-panel {
      padding: 20px;
      min-height: 600px;
      position: relative;
    }

    #canvas {
      width: 100%;
      height: 600px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
    }

    .sidebar {
      background: #f8f9fa;
      padding: 20px;
      border-left: 1px solid #e0e0e0;
      overflow-y: auto;
      max-height: 640px;
    }

    .sidebar h3 {
      margin-bottom: 15px;
      color: #333;
      font-size: 1.2em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .stat-item {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 3px solid #667eea;
    }

    .stat-item strong {
      display: block;
      color: #555;
      font-size: 0.85em;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-item span {
      font-size: 1.3em;
      color: #333;
      font-weight: 600;
    }

    .node-info {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #e0e0e0;
    }

    .node-info h4 {
      margin-bottom: 10px;
      color: #667eea;
    }

    .node-info p {
      margin: 5px 0;
      font-size: 0.9em;
      color: #666;
    }

    .neighbors-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .neighbor-item {
      background: #f8f9fa;
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #667eea;
      font-size: 1.2em;
      font-weight: 600;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .legend {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 0.9em;
    }

    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #333;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .search-results {
      max-height: 200px;
      overflow-y: auto;
    }

    .search-result-item {
      padding: 8px;
      background: white;
      margin: 5px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85em;
    }

    .search-result-item:hover {
      background: #667eea;
      color: white;
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Knowledge Graph Embedding Visualization</h1>
      <p>Interactive t-SNE visualization of theorem embeddings</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Load Embeddings</label>
        <input type="file" id="fileInput" accept=".json,.pt">
      </div>

      <div class="control-group">
        <label>Dimensionality Reduction</label>
        <select id="reductionMethod">
          <option value="tsne">t-SNE</option>
          <option value="pca">PCA</option>
          <option value="umap">UMAP (simulated)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Perplexity (t-SNE)</label>
        <input type="number" id="perplexity" value="30" min="5" max="50">
      </div>

      <div class="control-group">
        <label>Color By</label>
        <select id="colorBy">
          <option value="cluster">Cluster</option>
          <option value="degree">Node Degree</option>
          <option value="relation">Relation Type</option>
        </select>
      </div>

      <button id="runVisualization" disabled>Run Visualization</button>
      <button id="resetZoom">Reset Zoom</button>
    </div>

    <div class="main-content">
      <div class="visualization-panel">
        <canvas id="canvas"></canvas>
        <div id="loading" class="loading" style="display: none;">
          <div class="spinner"></div>
          <p>Computing embeddings...</p>
        </div>
      </div>

      <div class="sidebar">
        <h3>Statistics</h3>
        <div class="stat-item">
          <strong>Total Nodes</strong>
          <span id="totalNodes">0</span>
        </div>
        <div class="stat-item">
          <strong>Embedding Dim</strong>
          <span id="embeddingDim">0</span>
        </div>
        <div class="stat-item">
          <strong>Model Type</strong>
          <span id="modelType">-</span>
        </div>

        <h3 style="margin-top: 30px;">Search</h3>
        <input type="text" id="searchBox" class="search-box" placeholder="Search nodes...">
        <div id="searchResults" class="search-results"></div>

        <div id="nodeInfo" class="node-info" style="display: none;">
          <h4 id="selectedNodeName">Node</h4>
          <p><strong>ID:</strong> <span id="selectedNodeId"></span></p>
          <p><strong>Degree:</strong> <span id="selectedNodeDegree"></span></p>
          <div class="neighbors-list" id="neighborsList"></div>
        </div>

        <div class="legend">
          <strong>Legend</strong>
          <div id="legendContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========================================================================
    // Global State
    // ========================================================================
    let embeddings = null;
    let reducedEmbeddings = null;
    let nodeData = [];
    let canvas, ctx;
    let transform = { x: 0, y: 0, scale: 1 };
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    let selectedNode = null;
    let hoveredNode = null;

    // ========================================================================
    // Initialization
    // ========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');

      // Set canvas size
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Event listeners
      document.getElementById('fileInput').addEventListener('change', handleFileLoad);
      document.getElementById('runVisualization').addEventListener('click', runVisualization);
      document.getElementById('resetZoom').addEventListener('click', resetZoom);
      document.getElementById('searchBox').addEventListener('input', handleSearch);

      // Canvas interactions
      canvas.addEventListener('mousedown', handleMouseDown);
      canvas.addEventListener('mousemove', handleMouseMove);
      canvas.addEventListener('mouseup', handleMouseUp);
      canvas.addEventListener('wheel', handleWheel);
      canvas.addEventListener('click', handleClick);
    });

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      if (reducedEmbeddings) draw();
    }

    // ========================================================================
    // File Loading
    // ========================================================================
    async function handleFileLoad(event) {
      const file = event.target.files[0];
      if (!file) return;

      showLoading(true);

      try {
        const text = await file.text();
        embeddings = JSON.parse(text);

        // Update stats
        const nodes = Object.keys(embeddings.embeddings || embeddings);
        document.getElementById('totalNodes').textContent = nodes.length;
        document.getElementById('modelType').textContent = embeddings.model_type || 'Unknown';

        // Get embedding dimension
        const firstEmb = Object.values(embeddings.embeddings || embeddings)[0];
        const dim = Array.isArray(firstEmb) ? firstEmb.length : firstEmb[0]?.length || 0;
        document.getElementById('embeddingDim').textContent = dim;

        // Enable visualization button
        document.getElementById('runVisualization').disabled = false;

        showLoading(false);
      } catch (error) {
        console.error('Failed to load embeddings:', error);
        alert('Failed to load embeddings file. Please check the format.');
        showLoading(false);
      }
    }

    // ========================================================================
    // t-SNE Implementation (Simplified)
    // ========================================================================
    function computeTSNE(data, perplexity = 30) {
      // This is a simplified t-SNE implementation
      // In production, use a library like tsne-js

      const n = data.length;
      const dim = data[0].length;

      // Initialize output with random positions
      const Y = Array(n).fill(0).map(() => [
        Math.random() * 10 - 5,
        Math.random() * 10 - 5
      ]);

      // Compute pairwise distances
      const distances = Array(n).fill(0).map(() => Array(n).fill(0));
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          let dist = 0;
          for (let k = 0; k < dim; k++) {
            const diff = data[i][k] - data[j][k];
            dist += diff * diff;
          }
          distances[i][j] = distances[j][i] = Math.sqrt(dist);
        }
      }

      // Simplified gradient descent (50 iterations)
      const learningRate = 10;
      const iterations = 50;

      for (let iter = 0; iter < iterations; iter++) {
        // Compute gradients (simplified)
        const gradients = Y.map(() => [0, 0]);

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            if (i === j) continue;

            // High-dimensional similarity (Gaussian)
            const pij = Math.exp(-distances[i][j] * distances[i][j] / (2 * perplexity));

            // Low-dimensional similarity (Student t)
            const dy = [Y[i][0] - Y[j][0], Y[i][1] - Y[j][1]];
            const dist2d = Math.sqrt(dy[0] * dy[0] + dy[1] * dy[1]);
            const qij = 1 / (1 + dist2d * dist2d);

            // Gradient
            const coeff = 4 * (pij - qij) * qij;
            gradients[i][0] += coeff * dy[0];
            gradients[i][1] += coeff * dy[1];
          }
        }

        // Update positions
        for (let i = 0; i < n; i++) {
          Y[i][0] -= learningRate * gradients[i][0];
          Y[i][1] -= learningRate * gradients[i][1];
        }
      }

      return Y;
    }

    // ========================================================================
    // PCA Implementation
    // ========================================================================
    function computePCA(data) {
      const n = data.length;
      const dim = data[0].length;

      // Center data
      const mean = Array(dim).fill(0);
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < dim; j++) {
          mean[j] += data[i][j];
        }
      }
      mean.forEach((_, i) => mean[i] /= n);

      const centered = data.map(row => row.map((val, i) => val - mean[i]));

      // Compute covariance matrix (simplified - use first 2 dimensions)
      const result = centered.map(row => [row[0], row[1]]);

      return result;
    }

    // ========================================================================
    // Visualization
    // ========================================================================
    async function runVisualization() {
      if (!embeddings) return;

      showLoading(true);

      setTimeout(() => {
        try {
          // Extract embedding vectors
          const embData = embeddings.embeddings || embeddings;
          const nodes = Object.keys(embData);
          const vectors = nodes.map(node => {
            const emb = embData[node];
            return Array.isArray(emb) ? emb : Array.from(emb);
          });

          // Apply dimensionality reduction
          const method = document.getElementById('reductionMethod').value;
          const perplexity = parseInt(document.getElementById('perplexity').value);

          let reduced;
          if (method === 'tsne') {
            reduced = computeTSNE(vectors, perplexity);
          } else if (method === 'pca') {
            reduced = computePCA(vectors);
          } else {
            // UMAP simulation (just use PCA for now)
            reduced = computePCA(vectors);
          }

          // Normalize to canvas coordinates
          const minX = Math.min(...reduced.map(p => p[0]));
          const maxX = Math.max(...reduced.map(p => p[0]));
          const minY = Math.min(...reduced.map(p => p[1]));
          const maxY = Math.max(...reduced.map(p => p[1]));

          nodeData = nodes.map((node, i) => ({
            id: node,
            x: (reduced[i][0] - minX) / (maxX - minX),
            y: (reduced[i][1] - minY) / (maxY - minY),
            cluster: Math.floor(Math.random() * 5), // Placeholder
            degree: Math.floor(Math.random() * 20) + 1 // Placeholder
          }));

          reducedEmbeddings = reduced;

          // Update legend
          updateLegend();

          // Draw
          draw();

          showLoading(false);
        } catch (error) {
          console.error('Visualization failed:', error);
          alert('Visualization failed. Check console for details.');
          showLoading(false);
        }
      }, 100);
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);

      const colorBy = document.getElementById('colorBy').value;
      const colors = ['#667eea', '#f093fb', '#4facfe', '#43e97b', '#fa709a'];

      // Draw nodes
      nodeData.forEach(node => {
        const x = node.x * width * 0.9 + width * 0.05;
        const y = node.y * height * 0.9 + height * 0.05;

        // Determine color
        let color;
        if (colorBy === 'cluster') {
          color = colors[node.cluster % colors.length];
        } else if (colorBy === 'degree') {
          const intensity = node.degree / 20;
          color = `rgba(102, 126, 234, ${intensity})`;
        } else {
          color = colors[0];
        }

        // Draw node
        ctx.beginPath();
        ctx.arc(x, y, hoveredNode === node ? 8 : 5, 0, Math.PI * 2);
        ctx.fillStyle = selectedNode === node ? '#ff6b6b' : color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw label on hover
        if (hoveredNode === node || selectedNode === node) {
          ctx.fillStyle = '#333';
          ctx.font = '12px sans-serif';
          ctx.fillText(node.id.substring(0, 20), x + 10, y - 10);
        }
      });

      ctx.restore();
    }

    // ========================================================================
    // Interaction Handlers
    // ========================================================================
    function handleMouseDown(e) {
      isDragging = true;
      lastMouse = { x: e.offsetX, y: e.offsetY };
    }

    function handleMouseMove(e) {
      if (isDragging) {
        transform.x += e.offsetX - lastMouse.x;
        transform.y += e.offsetY - lastMouse.y;
        lastMouse = { x: e.offsetX, y: e.offsetY };
        draw();
      } else {
        // Check for hover
        const node = getNodeAtPosition(e.offsetX, e.offsetY);
        if (node !== hoveredNode) {
          hoveredNode = node;
          draw();
        }
      }
    }

    function handleMouseUp() {
      isDragging = false;
    }

    function handleWheel(e) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      transform.scale *= delta;
      transform.scale = Math.max(0.5, Math.min(5, transform.scale));
      draw();
    }

    function handleClick(e) {
      const node = getNodeAtPosition(e.offsetX, e.offsetY);
      if (node) {
        selectedNode = node;
        showNodeInfo(node);
        draw();
      }
    }

    function getNodeAtPosition(x, y) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      // Transform mouse coordinates
      const mx = (x - transform.x) / transform.scale;
      const my = (y - transform.y) / transform.scale;

      for (const node of nodeData) {
        const nx = node.x * width * 0.9 + width * 0.05;
        const ny = node.y * height * 0.9 + height * 0.05;

        const dist = Math.sqrt((mx - nx) ** 2 + (my - ny) ** 2);
        if (dist < 10) {
          return node;
        }
      }

      return null;
    }

    function resetZoom() {
      transform = { x: 0, y: 0, scale: 1 };
      draw();
    }

    // ========================================================================
    // UI Updates
    // ========================================================================
    function showNodeInfo(node) {
      document.getElementById('nodeInfo').style.display = 'block';
      document.getElementById('selectedNodeName').textContent = node.id;
      document.getElementById('selectedNodeId').textContent = node.id;
      document.getElementById('selectedNodeDegree').textContent = node.degree;

      // Show random neighbors (placeholder)
      const neighborsList = document.getElementById('neighborsList');
      neighborsList.innerHTML = '<strong>Nearest Neighbors:</strong>';
      for (let i = 0; i < 5; i++) {
        const randomNode = nodeData[Math.floor(Math.random() * nodeData.length)];
        const div = document.createElement('div');
        div.className = 'neighbor-item';
        div.innerHTML = `<span>${randomNode.id.substring(0, 15)}</span><span>0.85</span>`;
        neighborsList.appendChild(div);
      }
    }

    function handleSearch(e) {
      const query = e.target.value.toLowerCase();
      const results = document.getElementById('searchResults');

      if (!query || !nodeData.length) {
        results.innerHTML = '';
        return;
      }

      const matches = nodeData.filter(node =>
        node.id.toLowerCase().includes(query)
      ).slice(0, 10);

      results.innerHTML = '';
      matches.forEach(node => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.textContent = node.id;
        div.addEventListener('click', () => {
          selectedNode = node;
          showNodeInfo(node);
          draw();
        });
        results.appendChild(div);
      });
    }

    function updateLegend() {
      const legendContent = document.getElementById('legendContent');
      const colors = ['#667eea', '#f093fb', '#4facfe', '#43e97b', '#fa709a'];

      legendContent.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const div = document.createElement('div');
        div.className = 'legend-item';
        div.innerHTML = `
          <div class="legend-color" style="background: ${colors[i]}"></div>
          <span>Cluster ${i + 1}</span>
        `;
        legendContent.appendChild(div);
      }
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
