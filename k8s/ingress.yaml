apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formula-nebula-ingress
  namespace: formula-nebula
  labels:
    app: formula-nebula
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # TLS configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Performance tuning for high traffic
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "1m"

    # Connection settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Rate limiting (adjust based on needs)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Compression
    nginx.ingress.kubernetes.io/enable-compression: "true"
    nginx.ingress.kubernetes.io/compression-level: "6"

    # CORS (if needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
  - hosts:
    - formula-nebula.com
    - www.formula-nebula.com
    - api.formula-nebula.com
    secretName: formula-nebula-tls
  rules:
  - host: formula-nebula.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formula-nebula-web
            port:
              number: 80
  - host: www.formula-nebula.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formula-nebula-web
            port:
              number: 80
  - host: api.formula-nebula.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formula-nebula-web
            port:
              number: 80

---
# WebSocket Ingress (separate for better configuration)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formula-nebula-ws-ingress
  namespace: formula-nebula
  labels:
    app: formula-nebula
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # WebSocket specific configuration
    nginx.ingress.kubernetes.io/websocket-services: "formula-nebula-collab"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"

    # Connection upgrade for WebSocket
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;

    # Sticky sessions for WebSocket
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "collab-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    nginx.ingress.kubernetes.io/session-cookie-expires: "10800"

    # Rate limiting for WebSocket (more lenient)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  tls:
  - hosts:
    - ws.formula-nebula.com
    secretName: formula-nebula-ws-tls
  rules:
  - host: ws.formula-nebula.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: formula-nebula-collab
            port:
              number: 8080
