apiVersion: v1
kind: ConfigMap
metadata:
  name: formula-nebula-config
  namespace: formula-nebula
data:
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Collaboration Server Config
  COLLAB_PORT: "8080"
  MAX_CONNECTIONS: "10000"
  HEARTBEAT_INTERVAL: "30000"
  CONNECTION_TIMEOUT: "60000"

  # WebSocket Configuration
  WS_MAX_PAYLOAD: "10485760"  # 10MB
  WS_COMPRESSION: "true"
  WS_PER_MESSAGE_DEFLATE: "true"

  # Performance Tuning
  WORKER_THREADS: "4"
  MAX_ROOMS: "50000"
  ROOM_IDLE_TIMEOUT: "3600000"  # 1 hour

  # Cache Configuration
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"

  # Rate Limiting
  RATE_LIMIT_WINDOW: "60000"  # 1 minute
  RATE_LIMIT_MAX_REQUESTS: "100"

  # CORS Configuration
  CORS_ORIGIN: "*"
  CORS_CREDENTIALS: "true"

  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/health"

  # Frontend Build Config
  VITE_API_URL: "https://api.formula-nebula.com"
  VITE_WS_URL: "wss://ws.formula-nebula.com"
  VITE_CDN_URL: "https://cdn.formula-nebula.com"
