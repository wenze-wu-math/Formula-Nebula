  # Example: echo -n 'your-secret' | base64

  # Database credentials
  DB_PASSWORD: Y2hhbmdlLW1lLXBsZWFzZQ==  # "change-me-please"
  DB_USERNAME: Zm9ybXVsYV91c2Vy  # "formula_user"

  # Redis password
  REDIS_PASSWORD: cmVkaXMtc2VjcmV0LXBhc3M=  # "redis-secret-pass"

