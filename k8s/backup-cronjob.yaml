apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: formula-nebula
  labels:
    app: postgres
    type: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              BACKUP_FILE="/backup/postgres-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
              echo "Starting backup to $BACKUP_FILE"
              pg_dump -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB | gzip > $BACKUP_FILE
              echo "Backup completed: $BACKUP_FILE"
              # Keep only last 30 days of backups
              find /backup -name "postgres-backup-*.sql.gz" -mtime +30 -delete
              echo "Old backups cleaned up"
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: formula-nebula-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: formula-nebula-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: formula-nebula-secrets
                  key: DB_PASSWORD
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: postgres-backup-pvc

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-snapshot
  namespace: formula-nebula
  labels:
    app: redis
    type: snapshot
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: redis-snapshot
        spec:
          restartPolicy: OnFailure
          containers:
          - name: redis-snapshot
            image: redis:7-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "Triggering Redis BGSAVE"
              redis-cli -h redis-service -a $REDIS_PASSWORD BGSAVE
              echo "Redis snapshot initiated"
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: formula-nebula-secrets
                  key: REDIS_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

---
# Cleanup job for old logs and temp files
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-job
  namespace: formula-nebula
  labels:
    type: maintenance
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cleanup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: busybox:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting cleanup job"
              # Clean up old log files (if using persistent log storage)
              find /logs -name "*.log" -mtime +7 -delete
              echo "Old logs cleaned up"
              # Clean up temporary files
              find /tmp -type f -mtime +1 -delete
              echo "Temporary files cleaned up"
              echo "Cleanup job completed"
            volumeMounts:
            - name: logs-volume
              mountPath: /logs
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
          volumes:
          - name: logs-volume
            persistentVolumeClaim:
              claimName: logs-pvc
