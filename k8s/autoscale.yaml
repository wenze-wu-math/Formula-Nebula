apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: formula-nebula-web-hpa
  namespace: formula-nebula
  labels:
    app: formula-nebula
    component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: formula-nebula-web
  minReplicas: 10
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 10
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: formula-nebula-collab-hpa
  namespace: formula-nebula
  labels:
    app: formula-nebula
    component: collaboration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: formula-nebula-collab
  minReplicas: 20
  maxReplicas: 200  # Higher for WebSocket handling
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: websocket_connections
      target:
        type: AverageValue
        averageValue: "500"  # Scale when avg connections per pod exceeds 500
  - type: Pods
    pods:
      metric:
        name: active_rooms
      target:
        type: AverageValue
        averageValue: "250"  # Scale based on active rooms
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Longer stabilization for WebSocket
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
      - type: Pods
        value: 5
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 20
        periodSeconds: 30
      selectPolicy: Max

---
# Vertical Pod Autoscaler (optional, requires VPA installed)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: formula-nebula-web-vpa
  namespace: formula-nebula
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: formula-nebula-web
  updatePolicy:
    updateMode: "Auto"  # Can be "Off", "Initial", or "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: web
      minAllowed:
        cpu: 200m
        memory: 256Mi
      maxAllowed:
        cpu: 4000m
        memory: 4Gi
      controlledResources: ["cpu", "memory"]

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: formula-nebula-collab-vpa
  namespace: formula-nebula
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: formula-nebula-collab
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: collab-server
      minAllowed:
        cpu: 500m
        memory: 512Mi
      maxAllowed:
        cpu: 8000m
        memory: 8Gi
      controlledResources: ["cpu", "memory"]

---
# Pod Disruption Budget for web deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: formula-nebula-web-pdb
  namespace: formula-nebula
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: formula-nebula
      component: web

---
# Pod Disruption Budget for collaboration deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: formula-nebula-collab-pdb
  namespace: formula-nebula
spec:
  minAvailable: 10
  selector:
    matchLabels:
      app: formula-nebula
      component: collaboration

---
# Cluster Autoscaler configuration (via annotations)
# This assumes you have cluster-autoscaler installed
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-config
  namespace: formula-nebula
data:
  # Node group configuration for cluster autoscaler
  scale-down-enabled: "true"
  scale-down-delay-after-add: "10m"
  scale-down-unneeded-time: "10m"
  scale-down-utilization-threshold: "0.5"
  max-node-provision-time: "15m"
  # Node pool sizes
  min-nodes: "10"
  max-nodes: "100"
