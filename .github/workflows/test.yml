name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: |
          npx prettier --check "src/**/*.{js,html,css,json}"
          npx prettier --check "scripts/**/*.mjs"

      - name: Lint JavaScript
        run: |
          npx eslint src/ --ext .js --max-warnings 0 || echo "ESLint not configured, skipping"

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify data integrity
        run: npm run check-data

      - name: Run verification scripts
        run: npm run verify
        timeout-minutes: 10

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          test -d dist/assets || (echo "Missing assets directory" && exit 1)
          echo "Build artifacts verified"

      - name: Upload build artifacts
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  browser-test:
    name: Browser Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: ['chromium', 'firefox']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build for testing
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          NEBULA_PREVIEW_PORT: 5176

      - name: Wait for server
        run: npx wait-on http://localhost:5176 -t 30000

      - name: Run browser tests
        run: node scripts/probe-perf.mjs
        env:
          URL: http://localhost:5176
          BROWSER: ${{ matrix.browser }}

      - name: Stop preview server
        if: always()
        run: pkill -f "vite preview" || true

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, build, browser-test]
    if: always()

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.browser-test.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully"
