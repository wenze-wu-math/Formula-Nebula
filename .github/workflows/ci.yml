name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege by default; the deploy job widens this as needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 gives the job full history. The duplicate-key control
      # verifies the detector against a pre-fix commit from history; on a
      # default depth-1 checkout that commit is unreachable and the check
      # would silently degrade to its inlined sample. Full history keeps the
      # real assertion running.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and builds
      # are reproducible. It also fails loudly if package.json and
      # package-lock.json drift apart, which is exactly how the previous
      # "@eslint/js@^10.14.0 does not exist" breakage went unnoticed.
      - name: Install dependencies
        run: npm ci

      # Data integrity: node/link counts and field coverage. Cheap and catches
      # accidental corruption of the generated knowledge-graph datasets.
      - name: Check data integrity
        run: node scripts/check-data.mjs

      - name: Check for duplicate object keys in data
        run: node scripts/_check-dupe-keys.mjs

      # The control runs the same detector against pre-fix sources from git
      # history and asserts it still finds the known duplicates. Without it a
      # "0 duplicates" result would be meaningless.
      - name: Verify duplicate-key detector still detects
        run: node scripts/_check-dupe-keys-control.mjs

      - name: Verify rescued proof explanations survive
        run: node scripts/_verify-explanation-rescue.mjs

      # Real assertions: these throw on failure instead of printing via
      # console.assert. Runs on plain node, no test framework needed.
      - name: Run unit tests
        run: npm test

      # The project's own pure-Node verifiers: 412 assertions covering
      # deep-link encoding, the query language, SVG export, the relation
      # classifier, proof data validity and layout invariants. They need no
      # browser and take ~3s, but were previously unreachable in CI (only via
      # 'npm run verify', which also spins up a browser).
      - name: Run pure-Node verifiers
        run: npm run test:pure

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          # The entry bundle must be referenced by the built HTML; if this ever
          # stops being true the deployed site would boot to a blank page.
          grep -q '/assets/index-' dist/index.html || { echo "built HTML does not reference an /assets entry bundle"; exit 1; }
          echo "dist size (excluding sourcemaps):"
          du -sh --exclude='*.map' dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Deploy to GitHub Pages. Runs only on main, and only after Build succeeds.
  # Requires: Settings -> Pages -> Source = "GitHub Actions".
  # Until that is enabled the deploy job will fail at the deploy step; the
  # Build job above still gives a green/red signal on every push.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enabling Pages is a one-time repository setting that cannot be done
      # from a workflow file. Until it is enabled, `configure-pages` fails and
      # would paint the whole pipeline red on every push even though the build
      # is healthy. Probe it first and skip the deploy cleanly if absent.
      #
      # To turn it on: Settings -> Pages -> Build and deployment
      #                -> Source = "GitHub Actions"
      - name: Check whether Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled - deploying."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Skipping deploy. Enable it in Settings -> Pages -> Source: GitHub Actions."
          fi

      - name: Setup Node.js
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        if: steps.pages_check.outputs.enabled == 'true'
        run: npm ci

      # GitHub Pages serves project sites from /<repo>/, so every asset URL
      # needs that prefix. vite.config.js reads NEBULA_BASE for this.
      - name: Build for Pages sub-path
        if: steps.pages_check.outputs.enabled == 'true'
        env:
          NEBULA_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
