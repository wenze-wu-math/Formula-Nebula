name: CodeQL

# Code scanning with an explicit, documented scope.
#
# The repository previously relied on GitHub's default code scanning setup,
# which scanned everything — including one-off data-scraping scripts under
# scripts/ and kb-src/. Those produced ~20 alerts of the "regex-based HTML
# tag stripping" family that are true-but-not-applicable, and they buried the
# two findings that did matter (a ReDoS in src/api-keys/ and a double-escaping
# bug in the LaTeX exporter), both now fixed.
#
# .github/codeql/codeql-config.yml records which paths are out of scope and
# why. The application (src/, designs/) stays fully in scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query can flag something even without a push.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      # No build step: this is plain JavaScript, so CodeQL analyses the source
      # directly. Building first would only slow the job down.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
