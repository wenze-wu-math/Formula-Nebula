name: Performance Benchmarks

on:
  schedule:
    # Run nightly at 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/probe-perf.mjs'

permissions:
  contents: write
  issues: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        browser: ['chromium', 'firefox']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build project
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          NEBULA_PREVIEW_PORT: 5176

      - name: Wait for server
        run: npx wait-on http://localhost:5176 -t 30000

      - name: Run performance benchmarks
        run: |
          echo "# Performance Benchmark - ${{ matrix.browser }}" > benchmark-${{ matrix.browser }}.md
          echo "" >> benchmark-${{ matrix.browser }}.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> benchmark-${{ matrix.browser }}.md
          echo "**Commit:** ${{ github.sha }}" >> benchmark-${{ matrix.browser }}.md
          echo "**Browser:** ${{ matrix.browser }}" >> benchmark-${{ matrix.browser }}.md
          echo "" >> benchmark-${{ matrix.browser }}.md

          node scripts/probe-perf.mjs 2>&1 | tee -a benchmark-${{ matrix.browser }}.md
        env:
          URL: http://localhost:5176
          BROWSER: ${{ matrix.browser }}

      - name: Stop preview server
        if: always()
        run: pkill -f "vite preview" || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.browser }}-${{ github.sha }}
          path: benchmark-${{ matrix.browser }}.md
          retention-days: 90

      - name: Store results
        run: |
          mkdir -p benchmarks
          cp benchmark-${{ matrix.browser }}.md benchmarks/benchmark-${{ matrix.browser }}-$(date +%Y%m%d-%H%M%S).md

  compare:
    name: Compare Results
    runs-on: ubuntu-latest
    needs: benchmark
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: current-benchmarks

      - name: Compare with baseline
        run: |
          echo "# Benchmark Comparison Report" > comparison-report.md
          echo "" >> comparison-report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> comparison-report.md
          echo "**Commit:** ${{ github.sha }}" >> comparison-report.md
          echo "" >> comparison-report.md

          # Extract metrics from current benchmarks
          for browser in chromium firefox; do
            if [ -f "current-benchmarks/benchmark-${browser}-${{ github.sha }}/benchmark-${browser}.md" ]; then
              echo "## ${browser^} Results" >> comparison-report.md
              echo "" >> comparison-report.md
              cat "current-benchmarks/benchmark-${browser}-${{ github.sha }}/benchmark-${browser}.md" >> comparison-report.md
              echo "" >> comparison-report.md
            fi
          done

          echo "## Analysis" >> comparison-report.md
          echo "" >> comparison-report.md
          echo "- All benchmarks completed successfully" >> comparison-report.md
          echo "- Results stored for historical tracking" >> comparison-report.md

      - name: Check performance regressions
        run: |
          echo "Checking for performance regressions..."

          # Define thresholds
          MAX_LOAD_TIME=10000  # 10 seconds
          MAX_MEMORY=512       # 512 MB

          # Parse results and check thresholds
          for file in current-benchmarks/*/benchmark-*.md; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"

              # Extract load time (example - adjust based on actual output)
              LOAD_TIME=$(grep -oP 'load time[:\s]+\K\d+' "$file" || echo "0")
              MEMORY=$(grep -oP 'memory[:\s]+\K\d+' "$file" || echo "0")

              if [ "$LOAD_TIME" -gt "$MAX_LOAD_TIME" ]; then
                echo "⚠️ Performance regression detected: Load time ${LOAD_TIME}ms exceeds threshold ${MAX_LOAD_TIME}ms"
                echo "regression=true" >> $GITHUB_ENV
              fi

              if [ "$MEMORY" -gt "$MAX_MEMORY" ]; then
                echo "⚠️ Memory regression detected: ${MEMORY}MB exceeds threshold ${MAX_MEMORY}MB"
                echo "regression=true" >> $GITHUB_ENV
              fi
            fi
          done

          if [ "${regression:-false}" == "true" ]; then
            echo "Performance regressions detected"
            exit 1
          else
            echo "No performance regressions detected"
          fi

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report-${{ github.sha }}
          path: comparison-report.md
          retention-days: 90

      - name: Commit benchmark results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p .benchmarks
          cp current-benchmarks/*/benchmark-*.md .benchmarks/ || true
          cp comparison-report.md .benchmarks/latest-comparison.md

          git add .benchmarks/
          git commit -m "chore: update performance benchmarks [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"

  alert:
    name: Performance Alert
    runs-on: ubuntu-latest
    needs: compare
    if: failure()
    timeout-minutes: 5

    steps:
      - name: Create issue for regression
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            # Performance Regression Alert

            A performance regression has been detected in the nightly benchmark run.

            **Commit:** ${{ github.sha }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Action Required

            Please review the benchmark results and investigate the performance degradation.

            **Artifacts:**
            - [Benchmark Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## Possible Causes

            - Algorithm changes in the layout engine
            - Increased data processing overhead
            - Memory leaks
            - Rendering pipeline changes
            - Dependency updates

            ---
            *This issue was automatically created by the benchmark workflow*
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance-regression'
            });

            const existingIssue = issues.data.find(issue => issue.title.includes('Performance Regression Detected'));

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔴 Another regression detected in commit ${{ github.sha }}\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['performance-regression', 'automated']
              });
            }

      - name: Send Slack alert
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Performance regression detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Performance Regression Alert*\n*Repository:* ${{ github.repository }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [benchmark, compare]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-benchmarks

      - name: Generate summary report
        run: |
          echo "# Performance Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "**Workflow:** ${{ github.workflow }}" >> summary.md
          echo "**Run ID:** ${{ github.run_id }}" >> summary.md
          echo "**Commit:** ${{ github.sha }}" >> summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> summary.md
          echo "" >> summary.md

          echo "## Results by Browser" >> summary.md
          for dir in all-benchmarks/benchmark-*; do
            if [ -d "$dir" ]; then
              echo "### $(basename $dir)" >> summary.md
              find "$dir" -name "*.md" -exec cat {} \; >> summary.md
              echo "" >> summary.md
            fi
          done

          echo "## Status" >> summary.md
          echo "- Benchmark: ${{ needs.benchmark.result }}" >> summary.md
          echo "- Compare: ${{ needs.compare.result }}" >> summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary-${{ github.sha }}
          path: summary.md
          retention-days: 90

      - name: Post summary to workflow
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY
