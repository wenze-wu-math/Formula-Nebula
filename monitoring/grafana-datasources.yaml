# Grafana Datasources Configuration
# Auto-provision datasources for Prometheus, Jaeger, and Elasticsearch

apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      customQueryParameters: ''
      defaultEditor: builder
    version: 1

  # Jaeger datasource for distributed tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: 'Elasticsearch'
        tags: ['trace_id', 'span_id']
        mappedTags: [{ key: 'service.name', value: 'service' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '-1h'
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        tags: [{ key: 'service.name', value: 'service' }]
        queries:
          - name: 'Request rate'
            query: 'sum(rate(http_requests_total{$$__tags}[5m]))'
    version: 1

  # Elasticsearch datasource for logs
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: 'formula-nebula-logs-*'
    editable: true
    jsonData:
      timeField: '@timestamp'
      esVersion: '8.0.0'
      logMessageField: 'message'
      logLevelField: 'level'
      maxConcurrentShardRequests: 5
      includeFrozen: false
      interval: Daily
      timeInterval: '10s'
      dataLinks:
        - datasourceUid: 'Jaeger'
          field: 'trace.id'
          url: 'http://localhost:16686/trace/$${__value.raw}'
    version: 1

  # Additional Prometheus for long-term storage (optional)
  - name: Prometheus-LTS
    type: prometheus
    access: proxy
    url: http://thanos-query:9090
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 1m
    version: 1
