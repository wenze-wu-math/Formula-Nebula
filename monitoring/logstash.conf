# Logstash Configuration for Formula Nebula
# Processes logs and sends them to Elasticsearch

input {
  # HTTP endpoint for structured logs
  http {
    port => 5000
    codec => json_lines
    type => "application"
  }

  # UDP endpoint for syslog
  udp {
    port => 5000
    codec => json_lines
    type => "application"
  }

  # File input for log files
  file {
    path => "/var/log/formula-nebula/*.log"
    start_position => "beginning"
    codec => json_lines
    type => "file"
  }
}

filter {
  # Parse timestamp
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Add hostname
  mutate {
    add_field => { "[@metadata][host]" => "%{host}" }
  }

  # Parse error stack traces
  if [context][error][stack] {
    mutate {
      add_field => { "error_stack" => "%{[context][error][stack]}" }
    }
  }

  # Tag by severity
  if [level] == "ERROR" or [level] == "error" {
    mutate {
      add_tag => ["error"]
    }
  } else if [level] == "WARN" or [level] == "warn" {
    mutate {
      add_tag => ["warning"]
    }
  }

  # Extract trace context
  if [context][traceId] {
    mutate {
      add_field => {
        "trace.id" => "%{[context][traceId]}"
      }
    }
  }

  if [context][spanId] {
    mutate {
      add_field => {
        "trace.span.id" => "%{[context][spanId]}"
      }
    }
  }

  # Grok patterns for unstructured logs
  if [type] == "file" and ![level] {
    grok {
      match => {
        "message" => [
          "\[%{LOGLEVEL:level}\] %{TIMESTAMP_ISO8601:timestamp} %{GREEDYDATA:log_message}",
          "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}"
        ]
      }
    }
  }

  # Parse user agent
  if [context][userAgent] {
    useragent {
      source => "[context][userAgent]"
      target => "user_agent"
    }
  }

  # GeoIP lookup for IP addresses
  if [context][ip] {
    geoip {
      source => "[context][ip]"
      target => "geoip"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "formula-nebula-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug output (optional, remove in production)
  # stdout {
  #   codec => rubydebug
  # }
}
